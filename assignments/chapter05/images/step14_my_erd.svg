<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="900" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
<title id="title">AI 튜터링 질문 관리 서비스 데이터 모델</title><desc id="desc">학생과 스터디는 질문을 만들고 질문에는 답변과 학습 자료가 연결됩니다.</desc>
<defs><style>
text{font-family:'Segoe UI','Malgun Gothic',Arial,sans-serif;fill:#17253a}.title{font-size:32px;font-weight:700}.sub{font-size:17px;fill:#53647a}.head{font-size:20px;font-weight:700;fill:#fff}.field{font-size:16px}.tag{font-size:13px;font-weight:700;fill:#31527c}.line{stroke:#557391;stroke-width:3;fill:none}.label{font-size:15px;font-weight:700;fill:#31527c}.note{font-size:15px;fill:#4d5d70}
</style></defs>
<rect width="1800" height="900" fill="#f5f8fc"/><text x="55" y="62" class="title">AI 튜터링 질문 관리 서비스</text><text x="55" y="92" class="sub">대상(학생·스터디·자료)과 반복 사건(질문·답변)을 나누고, 관계 근거를 표시한 초안</text>
<path class="line" d="M190 190 V130 H980 V175"/><text x="206" y="153" class="label">1</text><text x="918" y="153" class="label">0..N</text>
<path class="line" d="M710 305 H790"/><text x="720" y="288" class="label">1</text><text x="755" y="288" class="label">0..N</text>
<path class="line" d="M990 540 V630"/><text x="1006" y="565" class="label">1</text><text x="1006" y="615" class="label">0..N</text>
<path class="line" d="M1170 490 H1240 V600 H1320"/><text x="1180" y="470" class="label">1</text><text x="1284" y="582" class="label">0..N</text>
<path class="line" d="M1490 430 V520"/><text x="1506" y="455" class="label">1</text><text x="1506" y="505" class="label">0..N</text>
<g><rect x="40" y="190" width="300" height="250" rx="14" fill="#fff" stroke="#b9c9d9" stroke-width="2"/><path d="M40 204a14 14 0 0 1 14-14h272a14 14 0 0 1 14 14v44H40z" fill="#315a84"/><text x="62" y="228" class="head">students</text><text x="62" y="286" class="field">student_id <tspan class="tag">PK</tspan></text><line x1="60" y1="300" x2="320" y2="300" stroke="#e3eaf1"/><text x="62" y="332" class="field">name</text><text x="62" y="370" class="field">email <tspan class="tag">UNIQUE 미확정</tspan></text><text x="62" y="414" class="note">한 행 = 학생 한 명</text></g>
<g><rect x="410" y="190" width="300" height="250" rx="14" fill="#fff" stroke="#b9c9d9" stroke-width="2"/><path d="M410 204a14 14 0 0 1 14-14h272a14 14 0 0 1 14 14v44H410z" fill="#7656a3"/><text x="432" y="228" class="head">studies</text><text x="432" y="286" class="field">study_id <tspan class="tag">PK</tspan></text><line x1="430" y1="300" x2="690" y2="300" stroke="#e3eaf1"/><text x="432" y="332" class="field">study_name</text><text x="432" y="414" class="note">한 행 = 스터디·과목 한 건</text></g>
<g><rect x="790" y="175" width="380" height="365" rx="14" fill="#fff" stroke="#b9c9d9" stroke-width="2"/><path d="M790 189a14 14 0 0 1 14-14h352a14 14 0 0 1 14 14v44H790z" fill="#256c68"/><text x="812" y="213" class="head">questions</text><text x="812" y="270" class="field">question_id <tspan class="tag">PK</tspan></text><line x1="810" y1="284" x2="1150" y2="284" stroke="#e3eaf1"/><text x="812" y="316" class="field">student_id <tspan class="tag">FK</tspan></text><line x1="810" y1="330" x2="1150" y2="330" stroke="#e3eaf1"/><text x="812" y="362" class="field">study_id <tspan class="tag">FK</tspan></text><line x1="810" y1="376" x2="1150" y2="376" stroke="#e3eaf1"/><text x="812" y="408" class="field">question_title · question_text</text><line x1="810" y1="422" x2="1150" y2="422" stroke="#e3eaf1"/><text x="812" y="454" class="field">status · created_at</text><text x="812" y="510" class="note">한 행 = 학생이 등록한 질문 하나</text></g>
<g><rect x="790" y="630" width="380" height="205" rx="14" fill="#fff" stroke="#b9c9d9" stroke-width="2"/><path d="M790 644a14 14 0 0 1 14-14h352a14 14 0 0 1 14 14v44H790z" fill="#a15e42"/><text x="812" y="668" class="head">answers</text><text x="812" y="725" class="field">answer_id <tspan class="tag">PK</tspan> · question_id <tspan class="tag">FK</tspan></text><text x="812" y="763" class="field">answer_text · answered_at</text><text x="812" y="812" class="note">한 행 = 질문 답변 한 건</text></g>
<g><rect x="1320" y="190" width="400" height="240" rx="14" fill="#fff" stroke="#b9c9d9" stroke-width="2"/><path d="M1320 204a14 14 0 0 1 14-14h372a14 14 0 0 1 14 14v44h-400z" fill="#486b87"/><text x="1342" y="228" class="head">learning_resources</text><text x="1342" y="286" class="field">resource_id <tspan class="tag">PK</tspan></text><line x1="1340" y1="300" x2="1700" y2="300" stroke="#e3eaf1"/><text x="1342" y="332" class="field">title</text><text x="1342" y="370" class="field">resource_url</text><text x="1342" y="414" class="note">한 행 = 학습 자료 한 건</text></g>
<g><rect x="1320" y="520" width="400" height="230" rx="14" fill="#fff" stroke="#b9c9d9" stroke-width="2"/><path d="M1320 534a14 14 0 0 1 14-14h372a14 14 0 0 1 14 14v44h-400z" fill="#5b7187"/><text x="1342" y="558" class="head">question_resources</text><text x="1342" y="616" class="field">question_id <tspan class="tag">PK · FK</tspan></text><line x1="1340" y1="630" x2="1700" y2="630" stroke="#e3eaf1"/><text x="1342" y="662" class="field">resource_id <tspan class="tag">PK · FK</tspan></text><text x="1342" y="718" class="note">복합 PK 후보 · 연결 행</text></g>
<rect x="40" y="860" width="1680" height="1" fill="#dbe4ee"/><text x="55" y="885" class="note">미확정: 질문당 답변 수와 미답변 허용, 자료 재사용 범위, 비밀 질문 권한, 탈퇴·스터디 종료 뒤 보존 정책</text>
</svg>
